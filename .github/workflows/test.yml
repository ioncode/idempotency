name: "Ultra-Performance Quality Gate"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: "Integration, Chaos & Mutation Testing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: "Run Unit & Race Tests"
        run: go test -v -race ./...

      - name: "Run Chaos Network Tests"
        run: go test -v -race -tags=chaos -timeout 5m ./...
      - name: "Mutation Testing"
        run: |
          go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          go-mutesting github.com/ioncode/idempotency || echo "Mutation testing uncovered logic gaps"

  benchmark:
    name: "Continuous Performance Benchmarking"
    runs-on: ubuntu-latest
    needs: test
        # Запускаем официальный контейнер Redis внутри CI
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: "Run Microbenchmarks"
        run: go test -benchmem -run=^$ -bench=. ./... | tee bench_output.txt
      - name: "Store Benchmark Result Trends"
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: bench_output.txt
          fail-on-alert: true
          save-data-file: true
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '150%'
